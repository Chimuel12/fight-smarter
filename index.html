<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FightSmarter</title>
<meta name="description" content="Tu diario de kickboxing: lo que hiciste en clase, por voz o escrito, y vídeos de tu técnica.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FightSmarter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-v1.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<style>
:root{--bg:#000;--card:#111317;--card2:#1c1f26;--line:#262a31;--fg:#f4f6f8;--muted:#8b93a0;--acc:#4C8DFF;--red:#ff453a;--r:20px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
main{max-width:560px;margin:0 auto}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:40px;height:40px;border-radius:11px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:-2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stats div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.stats b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.month{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 8px}
.entry{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer}
.entry .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.entry .day{font-weight:700;font-size:16px}
.entry .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:8px;padding:2px 8px;margin:8px 6px 0 0}
.entry p{margin-top:8px;color:#d4d9e0;font-size:15px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.entry .vids{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumb{position:relative;flex:0 0 auto;width:96px;height:128px;border-radius:12px;overflow:hidden;background:var(--card2)}
.thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb:after{content:"▶";position:absolute;inset:auto 6px 6px auto;font-size:12px;background:#0008;border-radius:8px;padding:2px 7px}
.thumb small{position:absolute;left:6px;top:6px;right:6px;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);border:0;border-radius:20px;padding:17px 28px;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#5AA2FF,#1E5BE0);box-shadow:0 10px 30px #1E5BE066;cursor:pointer;white-space:nowrap}
/* editor */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 30px);z-index:10}
.sheet[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 14px}
.bar button{border:0;background:none;font-size:17px;padding:8px 2px;cursor:pointer;color:var(--acc)}
.bar .save{font-weight:700}
.bar h2{font-size:17px}
.form{max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.f input{background:var(--card2);border:0;border-radius:12px;padding:11px 10px;font-size:16px;width:100%;min-width:0}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:#2c313a;color:var(--fg)}
.notes{position:relative}
textarea{width:100%;min-height:170px;background:var(--card2);border:0;border-radius:14px;padding:14px;font-size:16px;line-height:1.5;resize:vertical}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;margin-bottom:10px;font-weight:700;font-size:16px;background:var(--card2);color:var(--fg);cursor:pointer}
.mic.on{background:var(--red);color:#fff}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.mic.on .dot{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;border-radius:999px;padding:8px 13px;background:var(--card2);font-size:14px;font-weight:600;cursor:pointer;color:var(--fg)}
.chips button.on{background:var(--acc);color:#fff}
h3{font-size:15px;margin-bottom:10px}
.vrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.vrow video{width:72px;height:96px;object-fit:cover;border-radius:10px;background:var(--card2);flex:0 0 auto}
.vrow input{flex:1;background:var(--card2);border:0;border-radius:12px;padding:11px;font-size:15px;min-width:0}
.vrow button{border:0;background:none;color:var(--red);font-size:22px;padding:6px;cursor:pointer}
.add{display:block;width:100%;border:1.5px dashed #3a404a;border-radius:14px;padding:14px;text-align:center;color:var(--acc);font-weight:700;cursor:pointer}
.del{display:block;width:100%;border:0;background:none;color:var(--red);font-weight:600;padding:14px;cursor:pointer}
.player{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 50px) 0 calc(env(safe-area-inset-bottom) + 20px)}
.player[hidden]{display:none}
.player video{max-width:100%;max-height:100%}
.player button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:16px;border:0;background:#222;color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer}
.player p{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:64px;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192-v1.png" alt="">
    <div><h1>FightSmarter</h1><div class="sub">Tu diario de kickboxing</div></div>
  </header>
  <div class="stats">
    <div><b id="s-week">0</b><span>esta semana</span></div>
    <div><b id="s-month">0</b><span>este mes</span></div>
    <div><b id="s-hours">0</b><span>horas en total</span></div>
  </div>
  <div id="list"></div>
  <p class="foot">Todo se guarda solo en este teléfono.<br>Instálala: iPhone → Safari → Compartir → Añadir a inicio · Android → Chrome → ⋮ → Instalar app</p>
</main>
<button class="fab" id="new">＋ Anotar entreno</button>

<section class="sheet" id="sheet" hidden>
  <div class="bar"><button id="cancel">Cancelar</button><h2 id="sheetTitle">Nuevo entreno</h2><button class="save" id="save">Guardar</button></div>
  <div class="form">
    <div class="card">
      <div class="grid">
        <label class="f">Día<input type="date" id="f-date"></label>
        <label class="f">Hora<input type="time" id="f-time"></label>
        <label class="f">Minutos<input type="number" id="f-min" inputmode="numeric" min="5" max="300" step="5"></label>
      </div>
      <div class="seg" id="f-type"><button data-v="Clase">Clase</button><button data-v="Sparring">Sparring</button><button data-v="En casa">En casa</button></div>
    </div>
    <div class="card notes">
      <h3>¿Qué hicisteis hoy?</h3>
      <button class="mic" id="mic"><span class="dot"></span><span id="micText">Dictar por voz</span></button>
      <textarea id="f-notes" placeholder="Por ejemplo: calentamiento con comba, jab-cross-low kick por parejas, 3 rounds de saco, defensa de patada media…"></textarea>
      <p class="hint" id="micHint"></p>
    </div>
    <div class="card">
      <h3>Lo que trabajaste</h3>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card">
      <h3>Vídeos de tu técnica</h3>
      <div id="vids"></div>
      <label class="add">＋ Añadir vídeo<input type="file" id="f-video" accept="video/*" hidden></label>
    </div>
    <button class="del" id="delete" hidden>Borrar este entreno</button>
  </div>
</section>

<div class="player" id="player" hidden><p id="playerTitle"></p><button id="closePlayer" aria-label="Cerrar">✕</button><video id="playerVideo" controls playsinline></video></div>

<script>
const TAGS = ['Jab', 'Cross', 'Gancho', 'Uppercut', 'Low kick', 'Patada media', 'Patada alta', 'Teep', 'Rodilla', 'Codo', 'Defensa', 'Combinaciones', 'Saco', 'Manoplas', 'Sparring', 'Comba', 'Físico']
const $ = id => document.getElementById(id)
const pad = n => String(n).padStart(2, '0')
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* ---------- storage: entries and video files, in this browser only (IndexedDB) ---------- */
let db
const open = () => new Promise((ok, no) => {
  const r = indexedDB.open('fightsmarter', 1)
  r.onupgradeneeded = () => { r.result.createObjectStore('entries', { keyPath: 'id' }); r.result.createObjectStore('videos', { keyPath: 'id' }) }
  r.onsuccess = () => ok(db = r.result); r.onerror = () => no(r.error)
})
const tx = (store, mode, fn) => new Promise((ok, no) => { const t = db.transaction(store, mode), s = t.objectStore(store), out = fn(s); t.oncomplete = () => ok(out?.result); t.onerror = () => no(t.error) })
const all = store => tx(store, 'readonly', s => s.getAll())
const put = (store, v) => tx(store, 'readwrite', s => s.put(v))
const del = (store, id) => tx(store, 'readwrite', s => s.delete(id))
const get = (store, id) => tx(store, 'readonly', s => s.get(id))
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7)

/* ---------- the diary ---------- */
let entries = []
const urls = new Map()
const videoURL = async id => { if (!urls.has(id)) { const v = await get('videos', id); if (v) urls.set(id, URL.createObjectURL(v.blob)) } return urls.get(id) }
const whenOf = e => new Date(`${e.date}T${e.time || '12:00'}`)
async function render() {
  entries = (await all('entries')).sort((a, b) => whenOf(b) - whenOf(a))
  const now = new Date(), mon = new Date(now); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7)
  const first = new Date(now.getFullYear(), now.getMonth(), 1)
  $('s-week').textContent = entries.filter(e => whenOf(e) >= mon).length
  $('s-month').textContent = entries.filter(e => whenOf(e) >= first).length
  $('s-hours').textContent = Math.round(entries.reduce((a, e) => a + (+e.min || 0), 0) / 6) / 10
  if (!entries.length) { $('list').innerHTML = '<div class="empty"><b>Tu diario está vacío</b>Después de entrenar, toca «Anotar entreno» y dicta lo que hicisteis.</div>'; return }
  let html = '', lastMonth = ''
  for (const e of entries) {
    const d = whenOf(e), m = d.toLocaleDateString('es', { month: 'long', year: 'numeric' })
    if (m !== lastMonth) { html += `<div class="month">${m}</div>`; lastMonth = m }
    html += `<div class="entry" data-id="${e.id}"><div class="top"><span class="day">${d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short' })}</span><span class="meta">${esc(e.time)} · ${e.min || '–'} min</span></div>
      <span class="badge">${esc(e.type)}</span>${(e.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join('')}
      ${e.notes ? `<p>${esc(e.notes)}</p>` : ''}
      ${(e.videos || []).length ? `<div class="vids">${e.videos.map(v => `<div class="thumb" data-v="${v.id}" data-n="${esc(v.name)}"><video muted playsinline preload="metadata" data-src="${v.id}"></video><small>${esc(v.name)}</small></div>`).join('')}</div>` : ''}</div>`
  }
  $('list').innerHTML = html
  for (const el of document.querySelectorAll('video[data-src]')) videoURL(el.dataset.src).then(u => { if (u) el.src = u + '#t=0.5' })
}
$('list').onclick = e => {
  const th = e.target.closest('.thumb')
  if (th) { e.stopPropagation(); return play(th.dataset.v, th.dataset.n) }
  const card = e.target.closest('.entry')
  if (card) edit(entries.find(x => x.id === card.dataset.id))
}
async function play(id, name) { $('playerVideo').src = await videoURL(id); $('playerTitle').textContent = name || ''; $('player').hidden = false; $('playerVideo').play().catch(() => {}) }
$('closePlayer').onclick = () => { $('playerVideo').pause(); $('player').hidden = true }

/* ---------- editor ---------- */
let cur = null, pending = []   // pending: videos added in this edit, not saved yet
function edit(e) {
  const now = new Date()
  cur = e ? structuredClone(e) : { id: uid(), date: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`, time: `${pad(now.getHours())}:${pad(now.getMinutes())}`, min: 60, type: 'Clase', notes: '', tags: [], videos: [] }
  pending = []
  $('sheetTitle').textContent = e ? 'Entreno' : 'Nuevo entreno'
  $('f-date').value = cur.date; $('f-time').value = cur.time; $('f-min').value = cur.min; $('f-notes').value = cur.notes
  $('delete').hidden = !e
  setType(cur.type); renderChips(); renderVids()
  $('sheet').hidden = false; $('sheet').scrollTop = 0
}
const setType = v => { cur.type = v; for (const b of $('f-type').children) b.classList.toggle('on', b.dataset.v === v) }
$('f-type').onclick = e => e.target.dataset.v && setType(e.target.dataset.v)
function renderChips() { $('chips').innerHTML = TAGS.map(t => `<button class="${cur.tags.includes(t) ? 'on' : ''}">${t}</button>`).join('') }
$('chips').onclick = e => { const t = e.target.textContent; if (e.target.tagName !== 'BUTTON') return; cur.tags = cur.tags.includes(t) ? cur.tags.filter(x => x !== t) : [...cur.tags, t]; renderChips() }
async function renderVids() {
  $('vids').innerHTML = cur.videos.map((v, i) => `<div class="vrow"><video muted playsinline preload="metadata" data-i="${i}"></video><input value="${esc(v.name)}" placeholder="Combinación, p. ej. jab-cross-low kick" data-i="${i}"><button data-i="${i}" aria-label="Quitar vídeo">✕</button></div>`).join('')
  for (const el of $('vids').querySelectorAll('video')) { const v = cur.videos[+el.dataset.i]; const p = pending.find(x => x.id === v.id); el.src = (p ? URL.createObjectURL(p.blob) : await videoURL(v.id)) + '#t=0.5' }
}
$('vids').oninput = e => { if (e.target.tagName === 'INPUT') cur.videos[+e.target.dataset.i].name = e.target.value }
$('vids').onclick = e => { if (e.target.tagName === 'BUTTON') { cur.videos.splice(+e.target.dataset.i, 1); renderVids() } }
$('f-video').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''
  if (!f) return
  const id = uid(); pending.push({ id, blob: f }); cur.videos.push({ id, name: '' }); renderVids()
}
$('cancel').onclick = () => { stopMic(); $('sheet').hidden = true }
$('save').onclick = async () => {
  stopMic()
  Object.assign(cur, { date: $('f-date').value, time: $('f-time').value, min: +$('f-min').value || 0, notes: $('f-notes').value.trim() })
  try {
    for (const p of pending) if (cur.videos.some(v => v.id === p.id)) await put('videos', p)
    const old = entries.find(x => x.id === cur.id)
    for (const v of old?.videos || []) if (!cur.videos.some(x => x.id === v.id)) await del('videos', v.id)
    await put('entries', cur)
    $('sheet').hidden = true; render()
  } catch (err) { console.error(err); alert('No se pudo guardar: ' + (err?.message || err)) }
}
$('delete').onclick = async () => {
  if (!confirm('¿Borrar este entreno y sus vídeos?')) return
  for (const v of cur.videos) await del('videos', v.id)
  await del('entries', cur.id); $('sheet').hidden = true; render()
}
$('new').onclick = () => edit(null)

/* ---------- dictation: the phone turns your voice into text ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
let rec = null, base = ''
function stopMic() { if (rec) { try { rec.stop() } catch {} rec = null } $('mic').classList.remove('on'); $('micText').textContent = 'Dictar por voz' }
$('mic').onclick = () => {
  if (rec) return stopMic()
  if (!SR) { $('f-notes').focus(); $('micHint').textContent = 'Toca el micrófono 🎤 del teclado y habla: el teléfono lo escribe.'; return }
  rec = new SR(); rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = true
  base = $('f-notes').value ? $('f-notes').value.replace(/\s*$/, '') + '\n' : ''
  let final = ''
  rec.onresult = ev => {
    let interim = ''
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) final += t.trim() + '. '; else interim += t }
    $('f-notes').value = base + final + interim
  }
  rec.onerror = ev => { $('micHint').textContent = ev.error === 'not-allowed' ? 'Permite el micrófono para dictar, o usa el micrófono del teclado.' : 'El dictado se cortó. Toca otra vez o usa el micrófono del teclado.'; stopMic() }
  rec.onend = () => { if (rec) stopMic() }
  try { rec.start(); $('mic').classList.add('on'); $('micText').textContent = 'Escuchando… toca para parar'; $('micHint').textContent = '' } catch { stopMic() }
}

open().then(render).catch(() => { $('list').innerHTML = '<div class="empty"><b>Este navegador no deja guardar datos</b>Abre la app fuera del modo privado.</div>' })
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {})
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
